<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style5.css') }}">
    <title>Raitha Bandava AI</title>
    <link rel="icon" type="image/png" href="{{url_for('static', filename='chatbot.png')}}">
 </head>
 <body>
    <form action="/action"></form>
    <div>
       <button class="lang" id="langBtn">Eng/ಕನ್ನಡ</button>
    </div>

    <div class="main">

    <div class="section" id="loan" >
        <img src="{{url_for('static',filename='chatbot.png')}}">
        <h3 id="chatbotHeading">Raitha Bandava</h3>      
    </div> 

    <div class="container">
        <h1 id="welcomeHeading"> Hello farmers👋  </h1>
        <h2 id="subtitleHeading">Ask me anything about farming.</h2>
        
        <div class="chat-area" id="chatArea">

        </div>

        <div class="chatInput">
            <button id="micBtn" class="circle" type="button">
                <img src="{{url_for('static', filename='mic.png')}}" >
            </button>
            <textarea id="userInput" rows="1" placeholder="Ask anything..."></textarea>
            <button id="sendBtn" class="circle send" type="button">
                <img src="{{url_for('static', filename='send.png')}}">
            </button>
        </div>
        
    </div>
<script src="{{url_for('static',filename='script.js')}}"></script>
 </body>
 </html>
