<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">
<title>Crop Calendar</title>
<link rel="icon" type="image/png" href="{{url_for('static', filename='photo2.png')}}">
</head>
<body>
<button class="lang" id="langBtn">Eng / ಕನ್ನಡ</button>
<div class="main">
    <div class="section">

        <img src="{{url_for('static',filename='photo2.png')}}">
        <h3 id="calendarHeading">Crop Calendar</h3>

    </div>


    <div class="selection">
   
        <p>
        <span id="districtLabel">District :</span>
        <select id="districtSelect" class="Select" required>
           <option value="" disabled selected>Select your district</option>
           <option value="Bagalkot">Bagalkot</option>
           <option value="Ballari">Ballari</option>
           <option value="Belagavi">Belagavi</option>
           <option value="Bengaluru Rural">Bengaluru Rural</option>
           <option value="Bengaluru Urban">Bengaluru Urban</option>
           <option value="Bidar">Bidar</option>
           <option value="Chamarajanagar">Chamarajanagar</option>
           <option value="Chikkaballapur">Chikkaballapur</option>
           <option  value="Chikkamagaluru">Chikkamagaluru</option>
           <option  value="Chitradurga">Chitradurga</option>
           <option  value="Dakshina Kannada">Dakshina Kannada</option>
           <option  value="Davanagere">Davanagere</option>
           <option  value="Dharwad">Dharwad</option>
           <option value="Gadag">Gadag</option>
           <option value="Hassan">Hassan</option>
           <option value="Haveri">Haveri</option>
           <option value="Kalaburagi">Kalaburagi</option>
           <option value="Kodagu">Kodagu</option>
           <option value="Kolar">Kolar</option>
           <option value="Koppal">Koppal</option>
           <option value="Mandya">Mandya</option>
           <option value="Mysuru">Mysuru</option>
           <option value="Raichur">Raichur</option>
           <option value="Ramanagara">Ramanagara</option>
           <option value="Shivamogga">Shivamogga</option>
           <option value="Tumakuru">Tumakuru</option>
           <option value="Udupi">Udupi</option>
           <option value="Uttara Kannada">Uttara Kannada</option>
           <option value="Vijayapura">Vijayapura</option>
           <option value="Vijayanagara">Vijayanagara</option>
           <option value="Yadgir">Yadgir</option>
        </select>
       </p>
    
       <p>
           <span id="soilLabel">Soil :</span>
           <select id="soilSelect" class="Select" required>
                 <option value="" disabled selected>Select your soil type</option>
                 <option value="Black">Black</option>
                 <option value="Red">Red</option>
                 <option value="Laterite">Laterite</option>
                 <option value="Coastal">Coastal</option>
                 <option value="Alluvial">Alluvial</option>
            </select>

        </p>


        <p>
            <span id="seasonLabel">Season :</span>
            <select id="seasonSelect" class="Select" required>
                <option value="" disabled selected>Select your season</option>
                <option value="Kharif">Kharif</option>
                <option value="Rabi">Rabi</option>
                <option value="Zaid">Zaid</option>
            </select>
        </p>
    <button id="submitBtn">Submit</button>
    <div class="crop_suges">
        <h3 id="crop_recom">------List of crops recommended------</h3>
        <ul id="cropList"></ul>
    </div>
</div>
</div>
       <script src="{{url_for('static',filename='script.js')}}"></script>
</body>
</html>
